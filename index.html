<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Générateur de code-barres</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  :root {
    --bg: #F5F5F3;
    --surface: #FFFFFF;
    --border: #DDDBD3;
    --border-strong: #B8B5AA;
    --text-primary: #1F1E1B;
    --text-secondary: #6B6862;
    --text-danger: #A32D2D;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text-primary);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 20px;
  }
  label {
    font-size: 14px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    font-size: 15px;
    font-family: "SFMono-Regular", Consolas, monospace;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    outline: none;
    background: #fff;
    color: var(--text-primary);
  }
  input[type="text"]:focus {
    border-color: #185FA5;
    box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.12);
  }
  #errMsg {
    font-size: 13px;
    color: var(--text-danger);
    margin: 6px 0 0;
    display: none;
  }
  #barcodeWrap {
    margin-top: 24px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 140px;
  }
  button {
    width: 100%;
    margin-top: 16px;
    height: 44px;
    font-size: 15px;
    font-weight: 500;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--text-primary);
    cursor: pointer;
  }
  button:hover { background: #F0EFEA; }
  button:active { transform: scale(0.98); }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Générateur de code-barres</h1>

  <label for="idInput">Identifiant ou mot de passe</label>
  <input id="idInput" type="text" placeholder="ex. ABC-10234" autofocus />
  <p id="errMsg"></p>

  <div id="barcodeWrap">
    <svg id="barcode"></svg>
  </div>

  <button id="printBtn">Imprimer</button>
</div>

<script>
const input = document.getElementById('idInput');
const errMsg = document.getElementById('errMsg');
const svg = document.getElementById('barcode');
const printBtn = document.getElementById('printBtn');

function render() {
  const val = input.value.trim();
  if (!val) {
    errMsg.style.display = 'none';
    svg.innerHTML = '';
    return;
  }
  try {
    JsBarcode(svg, val, {
      format: 'CODE128',
      lineColor: '#000000',
      background: 'transparent',
      width: 2,
      height: 80,
      fontSize: 14,
      margin: 10
    });
    errMsg.style.display = 'none';
  } catch (e) {
    errMsg.textContent = "Cet identifiant contient des caractères non pris en charge.";
    errMsg.style.display = 'block';
    svg.innerHTML = '';
  }
}

input.addEventListener('input', render);

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') printBtn.click();
});

printBtn.addEventListener('click', () => {
  const val = input.value.trim();
  if (!val) {
    errMsg.textContent = "Entrez un identifiant avant d'imprimer.";
    errMsg.style.display = 'block';
    return;
  }
  const svgMarkup = svg.outerHTML;
  const w = window.open('', '_blank');
  w.document.write(`
    <html>
      <head><title>${val}</title></head>
      <body style="margin:0; display:flex; align-items:center; justify-content:center; height:100vh;">
        ${svgMarkup}
      </body>
    </html>
  `);
  w.document.close();
  w.focus();
  setTimeout(() => { w.print(); w.close(); }, 250);
});
</script>

</body>
</html>
